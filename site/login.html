<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Meal Planner - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

  <nav>
    <div class="brand">
      <a href="../site/index.html" class="logo-link">
        <img src="../assets/images/mealplannerlogo.png" 
            alt="MealPlanner logo" 
            class="logo">
      </a>
    </div>

    <div id="auth-links"></div>
  </nav>

  <h1>Login to MealPlanner</h1>

  <section class="form-container">
    <form id="login-form" novalidate>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>

      <div id="form-error" class="form-error" aria-live="polite"></div>

      <button type="submit">Login</button>

    </form>

    <div class="oauth-divider">
      <span>or</span>
    </div>

    <a href="http://localhost:5000/auth/google" class="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
      Sign in with Google
    </a>

    <p class="form-secondary">
      New to MealPlanner? 
      <a href="./register.html">Register here</a>
    </p>
  </section>

  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/login.js"></script>

</body>
</html>
